<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090817">
  <meta name="description" content="Barisin_Hesaplari sosyal medya profilleri">
  <title>Barisin_Hesaplari</title>
  <style>
    :root {
      --bg: #090817;
      --panel: rgba(22, 17, 48, .78);
      --purple: #a855f7;
      --blue: #38bdf8;
      --text: #f8f7ff;
      --muted: #b9b3d4;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(117, 55, 220, .22), transparent 42%),
        radial-gradient(ellipse at 85% 75%, rgba(29, 126, 226, .17), transparent 44%),
        var(--bg);
    }
    #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    .page {
      width: min(100% - 32px, 820px);
      margin: 0 auto;
      padding: 42px 0 26px;
      animation: pageIn 1.1s ease both;
    }
    header { text-align: center; margin-bottom: 34px; }
    .crown {
      display: inline-grid; place-items: center;
      width: 68px; height: 68px; border-radius: 22px;
      color: #f4d6ff; font-size: 35px;
      background: linear-gradient(145deg, rgba(168,85,247,.25), rgba(56,189,248,.14));
      border: 1px solid rgba(201, 147, 255, .65);
      box-shadow: 0 0 24px rgba(168,85,247,.35), inset 0 0 18px rgba(56,189,248,.08);
      animation: crownGlow 3s ease-in-out infinite alternate;
    }
    h1 {
      margin: 18px 0 8px; font-size: clamp(2rem, 7vw, 3.3rem);
      line-height: 1.1; letter-spacing: -.04em;
      overflow-wrap: anywhere;
      background: linear-gradient(90deg, #f0abfc, #a5b4fc, #67e8f9, #f0abfc);
      background-size: 220% auto; color: transparent; background-clip: text;
      -webkit-background-clip: text;
      animation: titleGlow 7s linear infinite;
      text-shadow: 0 0 30px rgba(168,85,247,.14);
    }
    .subtitle { margin: 0; color: var(--muted); font-size: 1rem; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .social-card {
      --brand: #a855f7;
      position: relative; min-width: 0; padding: 22px;
      display: flex; flex-direction: column; gap: 17px;
      border-radius: 22px; overflow: hidden;
      text-decoration: none; color: var(--text);
      background: linear-gradient(145deg, rgba(30,23,61,.9), rgba(13,18,43,.88));
      border: 1px solid color-mix(in srgb, var(--brand) 62%, transparent);
      box-shadow: 0 0 18px color-mix(in srgb, var(--brand) 13%, transparent), inset 0 0 22px rgba(255,255,255,.018);
      transition: transform .24s ease, border-color .24s ease, box-shadow .24s ease, background .24s ease;
      animation: cardIn .85s ease both;
    }
    .social-card:nth-child(2) { animation-delay: .12s; }
    .social-card:nth-child(3) { animation-delay: .24s; }
    .social-card:nth-child(4) { animation-delay: .36s; }
    .social-card::before {
      content: ""; position: absolute; inset: -1px; pointer-events: none;
      background: radial-gradient(circle at 10% 0%, color-mix(in srgb, var(--brand) 20%, transparent), transparent 58%);
      opacity: .8;
    }
    .social-card:hover, .social-card:focus-visible {
      transform: translateY(-5px) scale(1.015);
      border-color: var(--brand);
      box-shadow: 0 0 15px color-mix(in srgb, var(--brand) 35%, transparent), 0 0 38px color-mix(in srgb, var(--brand) 22%, transparent), inset 0 0 25px color-mix(in srgb, var(--brand) 8%, transparent);
      outline: none;
    }
    .social-card:active { transform: scale(.985); }
    .card-top, .card-bottom { position: relative; display: flex; align-items: center; }
    .card-top { gap: 13px; }
    .logo {
      flex: 0 0 54px; width: 54px; height: 54px; display: grid; place-items: center;
      border-radius: 17px; background: color-mix(in srgb, var(--brand) 15%, #111126);
      color: var(--brand); border: 1px solid color-mix(in srgb, var(--brand) 42%, transparent);
      filter: drop-shadow(0 0 8px color-mix(in srgb, var(--brand) 24%, transparent));
    }
    .logo svg { width: 31px; height: 31px; display: block; }
    .name { margin: 0 0 4px; font-size: 1.12rem; font-weight: 750; }
    .username { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
    .card-bottom { justify-content: space-between; gap: 10px; }
    .visit { font-size: .88rem; font-weight: 700; color: var(--brand); }
    .copy-btn {
      position: relative; z-index: 2; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      border: 1px solid color-mix(in srgb, var(--brand) 55%, transparent);
      border-radius: 12px; padding: 9px 12px; min-height: 40px;
      color: var(--text); background: rgba(9,8,23,.72); font: inherit; font-size: .82rem; font-weight: 650;
      cursor: pointer; transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    .copy-btn:hover, .copy-btn:focus-visible { background: color-mix(in srgb, var(--brand) 22%, #111126); box-shadow: 0 0 16px color-mix(in srgb, var(--brand) 25%, transparent); outline: none; }
    .copy-btn:active { transform: scale(.95); }
    .copy-btn svg { width: 16px; height: 16px; }
    .tiktok { --brand: #fb7185; }
    .telegram { --brand: #38bdf8; }
    .reddit { --brand: #fb923c; }
    .youtube { --brand: #f87171; }
    footer { text-align: center; color: #827b9f; font-size: .8rem; margin-top: 30px; }
    #toast {
      position: fixed; z-index: 10; left: 50%; bottom: 24px;
      transform: translate(-50%, 18px); opacity: 0; pointer-events: none;
      max-width: calc(100vw - 32px); padding: 12px 18px; border-radius: 14px;
      color: #fff; background: rgba(28, 20, 54, .96);
      border: 1px solid rgba(192,132,252,.75);
      box-shadow: 0 0 24px rgba(168,85,247,.28);
      font-size: .92rem; text-align: center; transition: opacity .22s ease, transform .22s ease;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes crownGlow { from { box-shadow: 0 0 16px rgba(168,85,247,.28); } to { box-shadow: 0 0 30px rgba(56,189,248,.32), 0 0 44px rgba(168,85,247,.25); } }
    @keyframes titleGlow { to { background-position: 220% center; } }
    @media (max-width: 560px) {
      .page { width: min(100% - 24px, 420px); padding-top: 30px; }
      header { margin-bottom: 25px; }
      .cards { grid-template-columns: 1fr; gap: 14px; }
      .social-card { padding: 19px; }
      .subtitle { font-size: .92rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    let stars = [], width = 0, height = 0, dpr = 1;
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function resizeStars() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = width * dpr; canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(105, Math.floor(width * height / 8500));
      stars = Array.from({length: count}, () => ({
        x: Math.random() * width, y: Math.random() * height,
        r: Math.random() * 1.7 + .35, speed: Math.random() * .38 + .08,
        phase: Math.random() * Math.PI * 2, hue: Math.random() > .5 ? 190 : 270
      }));
    }
    function drawStars() {
      ctx.clearRect(0, 0, width, height);
      for (const s of stars) {
        const alpha = .35 + (Math.sin(s.phase) + 1) * .3;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${s.hue}, 95%, 78%, ${alpha})`; ctx.fill();
        if (!reducedMotion) { s.y -= s.speed; s.phase += .018; if (s.y < -3) { s.y = height + 3; s.x = Math.random() * width; } }
      }
      if (!reducedMotion) requestAnimationFrame(drawStars);
    }
    resizeStars(); drawStars();
    window.addEventListener("resize", () => { resizeStars(); if (reducedMotion) drawStars(); });

    const toast = document.getElementById("toast");
    let toastTimer;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1900);
    }
    function clickSound() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const audio = new AudioContextClass();
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(680, audio.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(420, audio.currentTime + .045);
        gain.gain.setValueAtTime(.045, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .055);
        oscillator.connect(gain); gain.connect(audio.destination);
        oscillator.start(); oscillator.stop(audio.currentTime + .06);
        oscillator.onended = () => audio.close();
      } catch (_) {}
    }
    document.querySelectorAll(".social-card").forEach(card => {
      card.addEventListener("click", event => {
        if (!event.target.closest(".copy-btn")) clickSound();
      });
    });
    document.querySelectorAll(".copy-btn").forEach(button => {
      button.addEventListener("click", async event => {
        event.preventDefault();
        event.stopPropagation();
        clickSound();
        const url = button.dataset.copy;
        const label = button.querySelector("span");
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(url);
          } else {
            const field = document.createElement("textarea");
            field.value = url; field.style.position = "fixed"; field.style.opacity = "0";
            document.body.appendChild(field); field.select();
            const success = document.execCommand("copy"); field.remove();
            if (!success) throw new Error("Kopyalama başarısız");
          }
          label.textContent = "Kopyalandı!";
          showToast("✓ Bağlantı kopyalandı!");
          setTimeout(() => { label.textContent = "Kopyala"; }, 1800);
        } catch (_) {
          showToast("Kopyalanamadı. Profil kartını açıp bağlantıyı kopyalayabilirsin.");
        }
      });
    });
  </script>

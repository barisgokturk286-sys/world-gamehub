
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10071f">
<title>Barisin_Hesaplari</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #f5f1ff;
  background: radial-gradient(
    ellipse at top,
    #35105c 0%,
    #100b1d 48%,
    #090a14 100%
  );
}

header, main, footer {
  max-width: 900px;
  margin: auto;
  padding: 22px;
}

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.logo {
  color: #d0a5ff;
  font-weight: 900;
  font-size: 19px;
  overflow-wrap: anywhere;
}

.status {
  color: #b9a7d1;
  font-size: 12px;
  border: 1px solid #49305f;
  padding: 8px 12px;
  border-radius: 20px;
  white-space: nowrap;
}

.hero {
  text-align: center;
  padding: 65px 0 38px;
}

.avatar {
  width: 94px;
  height: 94px;
  margin: auto;
  display: grid;
  place-items: center;
  font-size: 45px;
  border-radius: 28px;
  background: linear-gradient(135deg, #7929c7, #263caa);
  box-shadow: 0 0 38px #8034c555;
}

h1 {
  font-size: clamp(27px, 7vw, 43px);
  margin: 22px 0 12px;
  overflow-wrap: anywhere;
}

.hero p {
  color: #c4b8d6;
  line-height: 1.7;
}

.socials {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin: 25px 0 40px;
}

.social {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 105px;
  padding: 20px;
  text-decoration: none;
  color: white;
  background: #171426;
  border: 1px solid #39304d;
  border-radius: 20px;
  transition: transform .2s, border-color .2s,
              box-shadow .2s;
}

.social:hover {
  transform: translateY(-4px);
  border-color: #a56bfa;
  box-shadow: 0 8px 28px #8b35ff20;
}

.symbol {
  width: 49px;
  height: 49px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  font-size: 25px;
  border-radius: 15px;
  background: #292039;
}

.name {
  font-size: 17px;
  font-weight: bold;
}

.desc {
  color: #aaa0bd;
  font-size: 12px;
  margin-top: 7px;
}

.arrow {
  margin-left: auto;
  color: #c8a3ff;
  font-size: 20px;
}

footer {
  text-align: center;
  padding-bottom: 30px;
  color: #857895;
  font-size: 12px;
}

@media (max-width: 520px) {
  header, main, footer {
    padding: 17px;
  }

  .hero {
    padding-top: 48px;
  }

  .socials {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .social {
    min-height: 90px;
  }
}
</style>
</head>

<body>

<header>
  <nav>
    <div class="logo">✦ Barisin_Hesaplari</div>
    <div class="status">● Sosyal Hesaplar</div>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="avatar">👑</div>
    <h1>Barisin_Hesaplari</h1>
    <p>
      Bütün sosyal medya hesaplarım<br>
      tek bir yerde.
    </p>
  </section>

  <section class="socials">

    <a class="social"
       href="https://www.tiktok.com/"
       target="_blank" rel="noopener">
      <div class="symbol">♪</div>
      <div>
        <div class="name">TikTok</div>
        <div class="desc">TikTok profilim</div>
      </div>
      <div class="arrow">↗</div>
    </a>

    <a class="social"
       href="https://telegram.org/"
       target="_blank" rel="noopener">
      <div class="symbol">✈</div>
      <div>
        <div class="name">Telegram</div>
        <div class="desc">Telegram hesabım</div>
      </div>
      <div class="arrow">↗</div>
    </a>

    <a class="social"
       href="https://www.reddit.com/"
       target="_blank" rel="noopener">
      <div class="symbol">●</div>
      <div>
        <div class="name">Reddit</div>
        <div class="desc">Reddit profilim</div>
      </div>
      <div class="arrow">↗</div>
    </a>

    <a class="social"
       href="https://www.youtube.com/"
       target="_blank" rel="noopener">
      <div class="symbol">▶</div>
      <div>
        <div class="name">YouTube</div>
        <div class="desc">YouTube kanalım</div>
      </div>
      <div class="arrow">↗</div>
    </a>

  </section>
</main>

<footer>
  © 2026 Barisin_Hesaplari
</footer>

</body>
</html>
